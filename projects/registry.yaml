schema_version: 1
command_center:
  name: "Sigma Development Command Center"
  repository: "M17z2025/ai-command-center"

defaults:
  owner: "M17z2025"
  contract_manifest: ".sigma/project.yaml"
  status_file: "PROJECT_STATUS.md"
  agent_file: "AGENTS.md"
  security_assurance:
    required_for_material_work: true
    division: "headquarters/security/README.md"
    report_template: "templates/SIGMA_CYBER_SECURITY_REPORT.md"
    independent_gatekeeper: "sigma-security-gatekeeper"
    fail_closed_on_missing_required_evidence: true
  advisory_planning:
    required_for_material_development: true
    council: "headquarters/advisory/README.md"
    plan_template: "templates/SIGMA_DEVELOPMENT_ADVISORY_PLAN.md"
    planning_director: "sigma-development-planning-director"
    research_fallback: "research-director"

