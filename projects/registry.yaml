schema_version: 1
command_center:
  name: "Sigma Development Command Center"
  repository: "M17z2025/ai-command-center"

defaults:
  owner: "M17z2025"
  contract_manifest: ".sigma/project.yaml"
  status_file: "PROJECT_STATUS.md"
  agent_file: "AGENTS.md"
  security_assurance:
    required_for_material_work: true
    division: "headquarters/security/README.md"
    report_template: "templates/SIGMA_CYBER_SECURITY_REPORT.md"
    independent_gatekeeper: "sigma-security-gatekeeper"
    fail_closed_on_missing_required_evidence: true
  advisory_planning:
    required_for_material_development: true
    council: "headquarters/advisory/README.md"
    plan_template: "templates/SIGMA_DEVELOPMENT_ADVISORY_PLAN.md"
    planning_director: "sigma-development-planning-director"
    research_fallback: "research-director"
  algorithmic_engineering:
    required_for_material_software_development: true
    division: "headquarters/engineering/README.md"
    report_template: "templates/SIGMA_ALGORITHMIC_SOLUTION_REPORT.md"
    director: "algorithmic-engineering-director"
    independent_judge: "sigma-solution-judge"
    unresolved_behavior: "keep owned defects open as ACTIVE — WORKING with an exact next experiment; never fabricate success"
  engineering_rescue:
    required_for_broken_or_regressed_products: true
    protocol: "docs/ENGINEERING_RESCUE_PROTOCOL.md"
    report_template: "templates/SIGMA_ENGINEERING_RESCUE_REPORT.md"
    incident_owner: "sigma-engineering-support-desk"
    normal_terminal_state: "FIXED / VERIFIED"
    external_gate_keeps_incident_open: true

projects:
  - name: "Sigma Development Command Center"
    repository: "M17z2025/ai-command-center"
    lifecycle: active
    category: control-plane
    capabilities:
      - "Sigma Mesh autonomous software-development governance and evidence"
      - "Mitz PA owner personal operations and cross-app task orchestration"
    notes: "Canonical owner of Mitz PA intelligence, memory, research, tasks, approval and connector-orchestration requirements and reusable repository automation. Friday remains the delegated voice/telephone/mobile edge; no separate Mitz PA runtime claimed."

