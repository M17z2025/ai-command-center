# Decision 1 (2026-10-30): preserve historical repository identities as read-only
# redirects. These are NOT active standalone build targets. Physical GitHub
# archiving is independently gated until the migration PRs and sources are verified.
consolidated_repositories:
  - source: "M17z2025/alisha-os"
    canonical: "M17z2025/alisha-ai-platform"
    owner_product: "Friday AI"
    status: "archive_pending"
    explanation: "Static prototype and candidate capability catalogues, not a production assistant backend."
  - source: "M17z2025/alisha-repository-automation"
    canonical: "M17z2025/ai-command-center"
    owner_product: "Sigma Mesh"
    status: "archive_pending"
    explanation: "README/control-only duplicate; no standalone automation worker found."

# Revised owner instruction (2026-10-30): Mitz PA intelligence/tasks are
# incorporated into Sigma; Friday is the existing voice/mobile/telephony edge.
# Previous Decision 2 routing to Friday is superseded, not independently active.
