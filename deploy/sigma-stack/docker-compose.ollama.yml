services:
  ollama:
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    networks:
      - sigma-private
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    security_opt:
      - no-new-privileges:true

  ollama-model-init:
    image: ollama/ollama:0.34.3
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:?set OLLAMA_MODEL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:?set OLLAMA_EMBEDDING_MODEL}
      OLLAMA_WORKER_MODEL: ${OLLAMA_WORKER_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        ollama pull "${OLLAMA_MODEL}";
        ollama pull "${OLLAMA_EMBEDDING_MODEL}";
        ollama pull "${OLLAMA_WORKER_MODEL}"
    depends_on:
      - ollama
    networks:
      - sigma-private
    security_opt:
      - no-new-privileges:true

  sigma-runtime:
    environment:
      SIGMA_RUNTIME_PROVIDER: http
      SIGMA_LLM_ENDPOINT: http://ollama:11434/api/chat
      SIGMA_LLM_MODEL: ${OLLAMA_MODEL:?set OLLAMA_MODEL}
      SIGMA_LLM_PROTOCOL: ollama-chat
      SIGMA_LLM_API_KEY: ""
      SIGMA_LLM_TIMEOUT_SECONDS: ${SIGMA_LLM_TIMEOUT_SECONDS:-300}
      SIGMA_LLM_MAX_TOKENS: ${SIGMA_LLM_MAX_TOKENS:-768}
      SIGMA_LLM_CONTEXT_TOKENS: ${SIGMA_LLM_CONTEXT_TOKENS:-4096}
      SIGMA_LLM_DISABLE_THINKING: ${SIGMA_LLM_DISABLE_THINKING:-1}
      SIGMA_MAX_PARALLEL_SPECIALISTS: ${SIGMA_MAX_PARALLEL_SPECIALISTS:-1}
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully

  sigma-runner:
    build:
      context: ../..
      dockerfile: Dockerfile.sigma-runtime
    restart: unless-stopped
    command: ["python", "scripts/sigma_runner_daemon.py"]
    environment:
      SIGMA_RUNTIME_PROVIDER: http
      SIGMA_LLM_ENDPOINT: http://ollama:11434/api/chat
      SIGMA_LLM_MODEL: ${OLLAMA_MODEL:?set OLLAMA_MODEL}
      SIGMA_LLM_PROTOCOL: ollama-chat
      SIGMA_LLM_API_KEY: ""
      SIGMA_LLM_TIMEOUT_SECONDS: ${SIGMA_LLM_TIMEOUT_SECONDS:-300}
      SIGMA_LLM_MAX_TOKENS: ${SIGMA_LLM_MAX_TOKENS:-768}
      SIGMA_LLM_CONTEXT_TOKENS: ${SIGMA_LLM_CONTEXT_TOKENS:-4096}
      SIGMA_LLM_DISABLE_THINKING: ${SIGMA_LLM_DISABLE_THINKING:-1}
      SIGMA_MAX_PARALLEL_SPECIALISTS: ${SIGMA_MAX_PARALLEL_SPECIALISTS:-1}
      SIGMA_RUNTIME_DB: /data/sigma-runtime.db
      SIGMA_RUNNER_INTERVAL_SECONDS: ${SIGMA_RUNNER_INTERVAL_SECONDS:-60}
      SIGMA_RUNNER_EXECUTE: ${SIGMA_RUNNER_EXECUTE:-0}
      SIGMA_RUNNER_ALLOW_WRITE: ${SIGMA_RUNNER_ALLOW_WRITE:-0}
      SIGMA_RUNNER_CI_POLL_SECONDS: ${SIGMA_RUNNER_CI_POLL_SECONDS:-10}
      SIGMA_RUNNER_CI_TIMEOUT_SECONDS: ${SIGMA_RUNNER_CI_TIMEOUT_SECONDS:-900}
      SIGMA_RUNNER_MAX_REPAIRS: ${SIGMA_RUNNER_MAX_REPAIRS:-2}
      SIGMA_GITHUB_TOKEN: ${SIGMA_GITHUB_TOKEN:-}
      SIGMA_WORKER_ENDPOINT: ${SIGMA_WORKER_ENDPOINT:-http://sigma-worker:8091/missions}
      SIGMA_WORKER_TOKEN: ${SIGMA_WORKER_TOKEN:-}
      SIGMA_WORKER_TIMEOUT_SECONDS: ${SIGMA_WORKER_TIMEOUT_SECONDS:-900}
    volumes:
      - sigma-runtime-data:/data
    networks:
      - sigma-private
    security_opt:
      - no-new-privileges:true
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully

  sigma-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.sigma-worker
    restart: unless-stopped
    environment:
      SIGMA_WORKER_HOST: 0.0.0.0
      SIGMA_WORKER_PORT: "8091"
      SIGMA_WORKER_TOKEN: ${SIGMA_WORKER_TOKEN:?set SIGMA_WORKER_TOKEN}
      SIGMA_WORKER_ALLOW_WRITE: ${SIGMA_WORKER_ALLOW_WRITE:-0}
      SIGMA_WORKER_ALLOWED_REPOSITORIES: ${SIGMA_WORKER_ALLOWED_REPOSITORIES:-M17z2025/ai-command-center,M17z2025/mi7z-web,M17z2025/alisha-ai-platform,M17z2025/invoiceit-by-mi7z,M17z2025/lycia-zambia,M17z2025/umarketit,M17z2025/total-mining-intelligence,M17z2025/mybodyfit,M17z2025/tattooit,M17z2025/legalit,M17z2025/signit-by-mi7z,M17z2025/ihumanit,M17z2025/designit-ai-platform,M17z2025/synergy-ai-pay,M17z2025/lycia-limited}
      SIGMA_WORKER_ROOT: /workspaces
      SIGMA_WORKER_MODEL: ${OLLAMA_WORKER_MODEL:-qwen2.5:7b}
      SIGMA_WORKER_OLLAMA_URL: http://ollama:11434
      SIGMA_WORKER_MODEL_TIMEOUT_SECONDS: ${SIGMA_WORKER_MODEL_TIMEOUT_SECONDS:-900}
      SIGMA_WORKER_VERIFY_TIMEOUT_SECONDS: ${SIGMA_WORKER_VERIFY_TIMEOUT_SECONDS:-900}
      SIGMA_WORKER_KEEP_WORKSPACE: ${SIGMA_WORKER_KEEP_WORKSPACE:-0}
      SIGMA_GITHUB_TOKEN: ${SIGMA_GITHUB_TOKEN:-}
    volumes:
      - sigma-worker-workspaces:/workspaces
    expose:
      - "8091"
    networks:
      - sigma-private
    security_opt:
      - no-new-privileges:true
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully

volumes:
  ollama-data:
  sigma-worker-workspaces:
