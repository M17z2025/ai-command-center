services:
  openhands:
    image: ${OPENHANDS_IMAGE:-ghcr.io/openhands/agent-canvas:1.24.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENHANDS_PORT:-8000}:8000"
    volumes:
      - openhands-state:/home/openhands/.openhands
      - openhands-projects:/projects
    networks:
      - sigma-private
    security_opt:
      - no-new-privileges:true

volumes:
  openhands-state:
  openhands-projects:
