schema_version: 1
division:
  id: sigma-algorithmic-engineering-lab
  name: "Sigma Algorithmic Engineering & Solution Lab"
  leader: algorithmic-engineering-director
  reports_to: sigma-governor
  mission: "Generate, implement, test, compare and repair engineering solution candidates until the best evidence-backed solution within project constraints is established or the unresolved problem is explicitly recorded."
  evidence_over_confidence: true
  no_universal_solution_claim: true

