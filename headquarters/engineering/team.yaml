solution_tournament:
  minimum_candidates_when_meaningful: 2
  recommended_candidates_for_material_design_choice: 3
  hard_gates:
    - "correctness"
    - "mandatory security"
    - "data/authorization integrity where applicable"
  comparison_order:
    - "correctness and acceptance coverage"
    - "security and data integrity"
    - "reliability and recovery"
    - "measured performance/scalability where relevant"
    - "simplicity"
    - "maintainability/testability"
    - "compatibility/migration risk"
    - "operational/infrastructure cost"
    - "delivery effort"
  unresolved_behavior: "Record UNSOLVED / NEEDS NEXT EXPERIMENT with failed candidates and exact next test; never fabricate success."

artifact:
  template: "templates/SIGMA_ALGORITHMIC_SOLUTION_REPORT.md"
  name: "algorithmic-solution-report"
