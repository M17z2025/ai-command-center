schema_version: 1
taxonomy_id: sigma-universal-knowledge-v1
purpose: "Route human-knowledge missions to the correct Sigma leaders and specialist teams."

coverage_policy:
  claim: "Broad practical coverage of the owner's requested human-knowledge fields; not a claim of literally complete or infallible knowledge."
  unknown_subject_flow:
    - "route to research-director"
    - "identify nearest existing domains"
    - "perform source-backed domain discovery"
    - "create a provisional temporary specialist definition if needed"
    - "require evaluation before permanent registration"
  cross_domain_allowed: true
  multiple_primary_domains_allowed: true

pillars:
  - id: formal-natural-sciences
    name: "Formal & Natural Sciences"
    domains:
      - id: mathematics-logic
        name: "Mathematics & Logic"
        subjects: ["pure mathematics", "applied mathematics", "statistics", "probability", "calculus", "algebra", "geometry", "number theory", "discrete mathematics", "theoretical logic", "formal methods", "game theory", "operations research"]
      - id: physics
        name: "Physics"
        subjects: ["classical mechanics", "quantum mechanics", "relativity", "thermodynamics", "statistical mechanics", "electromagnetism", "particle physics", "nuclear physics", "condensed matter", "optics", "acoustics", "astrophysics"]
      - id: chemistry
        name: "Chemistry"
        subjects: ["organic chemistry", "inorganic chemistry", "physical chemistry", "analytical chemistry", "biochemistry", "materials chemistry", "electrochemistry", "chemical thermodynamics"]
      - id: earth-space-sciences
        name: "Earth, Climate & Space Sciences"
        subjects: ["geology", "geophysics", "geochemistry", "mineralogy", "meteorology", "climatology", "oceanography", "hydrology", "planetary science", "astronomy", "cosmology"]
      - id: life-sciences
        name: "Life Sciences"
        subjects: ["biology", "molecular biology", "cell biology", "biochemistry", "genetics", "genomics", "zoology", "botany", "microbiology", "ecology", "evolutionary science", "bioinformatics", "systems biology"]

  - id: computing-information-cyber
    name: "Computing, Information Technology & Cyber Security"
    domains:
      - id: computer-science
        name: "Computer Science"
        subjects: ["algorithms", "data structures", "theory of computation", "compilers", "operating systems", "distributed systems", "parallel computing", "computer architecture", "human-computer interaction"]
      - id: artificial-intelligence
