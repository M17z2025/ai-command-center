      - id: software-engineering
        name: "Coding & Software Engineering"
        subjects: ["software architecture", "programming languages", "API design", "web engineering", "mobile engineering", "testing", "DevOps", "SRE", "CI/CD", "developer tooling", "performance engineering"]
      - id: data-databases
        name: "Data & Database Systems"
        subjects: ["relational databases", "NoSQL", "data modelling", "data engineering", "data warehouses", "vector databases", "search", "information retrieval", "knowledge graphs", "data governance"]
      - id: networks-cloud
        name: "Networks, Cloud & Infrastructure"
