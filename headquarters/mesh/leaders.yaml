schema_version: 1
root_authority: "Mitesh"
governor: "sigma-governor"

global_team_factory:
  enabled: true
  permanent_agent_creation: "proposal + independent evaluation + promotion"
  temporary_agent_creation: "allowed by a registered leader for a bounded mission"
  child_may_outrank_parent: false
  required_temporary_fields:
    - "id"
    - "parent"
    - "mission"
    - "domain_scope"
    - "allowed_tools"
    - "prohibited_actions"
    - "evidence_requirements"
    - "expiry_or_review_condition"
  default_prohibited_actions:
    - "change root authority"
    - "self-promote"
    - "grant new permissions"
    - "provision secrets"
    - "commit secrets or private owner data"
    - "approve its own production promotion"
    - "perform destructive production actions without explicit authority"
    - "spend money without explicit authority"

leaders:
  - id: science-director
    name: "Sigma Science Director"
    parent: "sigma-governor"
    mission: "Lead formal and natural science reasoning and scientific verification."
    domains: ["mathematics-logic", "physics", "chemistry", "earth-space-sciences", "life-sciences"]
    may_create_children: true

  - id: mathematics-logic-master
    name: "Mathematics & Logic Master"
    parent: "science-director"
    mission: "Formalize problems, derive mathematical models, prove or falsify claims, and quantify uncertainty."
    domains: ["mathematics-logic"]
    may_create_children: true

  - id: physics-master
    name: "Physics Master"
    parent: "science-director"
    mission: "Reason from physical laws, models, experiments and dimensional constraints."
    domains: ["physics"]
    may_create_children: true

  - id: chemistry-master
    name: "Chemistry Master"
    parent: "science-director"
    mission: "Lead chemical, biochemical and analytical reasoning."
    domains: ["chemistry"]
    may_create_children: true

  - id: earth-space-master
    name: "Earth & Space Sciences Master"
