schema_version: 1
policy_id: sigma-project-team-ownership-v1
root_authority: "Mitesh"

ownership_rule:
  - "Every Sigma-managed build/project has one accountable Sigma build team."
  - "Every Sigma-connected chat for that project resolves to the same team; the chat is a work surface, not an isolated authority island."
  - "The team lead owns continuity of the build until the repository/project Definition of Done is satisfied or a genuine owner/external gate blocks further safe work."
  - "Sigma Scouter continuously searches for reusable open-source code/APIs that can reduce rebuild effort for every team."
  - "Every material release still requires independent security assurance and Sigma User Tester evidence."
  - "Teams may recruit bounded mission specialists under headquarters/authority.yaml, but project accountability does not move silently."
  - "Unknown/unmapped chats are held by Sigma Chief of Staff until a project identity is established; no duplicate project implementation is created by default."

mandatory_roles:
  portfolio_governor: "sigma-governor"
  planning: "sigma-development-planning-director"
  open_source_recon: "sigma-scouter"
  independent_solution_judge: "sigma-solution-judge"
  security_gate: "sigma-security-gatekeeper"
  user_acceptance: "sigma-user-tester"
  evidence: "sigma-evidence-verifier"

