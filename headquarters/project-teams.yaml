chat_resolution:
  precedence:
    - "explicit project named by owner"
    - "repository identity from projects/registry.yaml"
    - "chat/project folder name or chat_aliases"
    - "Drive blueprint identity"
    - "Sigma Chief of Staff holds and resolves ambiguity"
  rule: "A chat never silently creates a second competing team for an already-mapped project."

blueprint_sync:
  required_section_title: "Sigma Build Team & Ownership"
  required_fields:
    - "Accountable Sigma lead"
    - "Core specialists"
    - "Mandatory independent gates"
    - "Sigma Scouter"
    - "Source of truth"
    - "Chat continuity rule"
  update_rule: "When project team membership materially changes, update this manifest and the project's master blueprint/build pack."
