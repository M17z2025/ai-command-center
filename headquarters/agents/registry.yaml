schema_version: 1
root_authority: "Mitesh"

agents:
  - id: "sigma-governor"
    name: "Sigma Governor"
    role: "Portfolio governor and mission authority router"
    parent: "root"
    status: "registered"
    may_create_children: true

  - id: "sigma-chief-of-staff"
    name: "Sigma Chief of Staff"
    role: "Mission coordination, prioritisation and escalation"
    parent: "sigma-governor"
    status: "registered"

  - id: "chief-ai-scientist"
    name: "Chief AI Scientist"
    role: "AI architecture, agents, reasoning, memory and model evaluation"
    parent: "sigma-governor"
    status: "registered"
    children:
      - "llm-architecture-master"
      - "agent-systems-master"
      - "reasoning-systems-master"
      - "memory-systems-master"
      - "model-evaluation-master"
      - "ai-security-master"
      - "ai-infrastructure-master"

  - id: "sigma-development-planning-director"
    name: "Sigma Development Planning Director"
    role: "Cross-disciplinary development advice, executable planning and ordered pull-plan handoff"
    parent: "sigma-chief-of-staff"
    status: "registered"
    independent_from_single_domain: true

  - id: "algorithmic-engineering-director"
    name: "Sigma Algorithmic Engineering Director"
    role: "Algorithm design, competing solution generation, code implementation, debugging, benchmarking and independent test-driven selection"
    parent: "sigma-governor"
    status: "registered"
    children:
      - "algorithm-complexity-master"
      - "software-architecture-master"
      - "polyglot-coding-master"
      - "frontend-engineering-master"
      - "backend-api-engineering-master"
      - "algorithmic-mobile-engineering-master"
      - "database-data-engineering-master"
      - "distributed-cloud-systems-master"
      - "ai-agent-engineering-master"
      - "integration-automation-master"
      - "debugging-root-cause-master"
      - "performance-optimisation-master"
      - "formal-correctness-master"
      - "qa-test-engineering-master"
      - "fuzz-property-mutation-master"
      - "reliability-chaos-recovery-master"
      - "developer-tooling-ci-master"
      - "sigma-solution-judge"
      - "sigma-engineering-support-desk"

  - id: "engineering-director"
    name: "Engineering Director"
    role: "Software, systems, architecture and delivery engineering"
    parent: "sigma-governor"
    status: "registered"

  - id: "security-master"
    name: "Sigma Chief Cybersecurity Officer / Security Master"
    role: "Independent portfolio cybersecurity authority, threat modelling, hostile-path assurance and release security gate"
    parent: "sigma-governor"
    status: "registered"
    independent_from_implementer: true
    release_gate_authority: true
    children:
      - "appsec-master"
      - "identity-access-security-master"
      - "tenant-data-isolation-master"
      - "cloud-infrastructure-security-master"
      - "network-edge-security-master"
      - "supply-chain-security-master"
      - "secrets-cryptography-master"
      - "offensive-security-master"
      - "detection-response-forensics-master"
      - "ai-systems-security-master"
      - "api-mobile-integration-security-master"
      - "privacy-data-security-master"
      - "resilience-recovery-security-master"
      - "sigma-security-gatekeeper"

  - id: "sigma-user-tester"
    name: "Sigma User Tester"
    role: "Independent real-user acceptance and release evidence"
    parent: "sigma-governor"
    status: "registered"
    independent_from_implementer: true

  - id: "legal-compliance-master"
    name: "Legal & Compliance Master"
    role: "Legal issue-spotting, compliance workflow and evidence discipline"
    parent: "sigma-governor"
    status: "registered"

  - id: "business-strategy-master"
    name: "Business & Strategy Master"
    role: "Strategy, economics, product and operating-model analysis"
    parent: "sigma-governor"
    status: "registered"

  - id: "mining-resources-master"
    name: "Mining & Resources Master"
    role: "Mining, geology, commodities and resources analysis"
    parent: "sigma-governor"
    status: "registered"

  - id: "research-director"
    name: "Research Director"
    role: "Evidence gathering, source quality and uncertainty control"
    parent: "sigma-governor"
    status: "registered"

  - id: "agent-factory-controller"
    name: "Agent Factory Controller"
    role: "Create bounded specialist definitions under the authority contract"
    parent: "sigma-governor"
    status: "registered"
    production_permission: false

  - id: "evaluation-evolution-controller"
    name: "Evaluation & Evolution Controller"
    role: "Benchmark candidate agent versions and prevent silent self-promotion"
    parent: "sigma-governor"
    status: "registered"
    promotion_requires_evidence: true

status_meaning:
  registered: "The role and authority contract exist in GitHub. This does not claim a live autonomous runtime."


mesh_extension:
  issue: 22
  taxonomy: "headquarters/mesh/taxonomy.yaml"
  leaders: "headquarters/mesh/leaders.yaml"
  pipeline: "headquarters/mesh/pipeline.yaml"
  evidence: "headquarters/mesh/evidence.yaml"
  evolution: "headquarters/mesh/evolution.yaml"
  cognitive_methods: "headquarters/mesh/cognitive-methods.yaml"
  rule: "The mesh extends these permanent roles; overlapping IDs denote the same authority role, not a competing agent."
