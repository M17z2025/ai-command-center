schema_version: 1
review_id: sigma-owner-github-source-review-v1
reviewed_on: "2026-10-02"
source_registry: "headquarters/generator-factory/user-github-sources.yaml"
scope: "All external GitHub links currently preserved in the owner-supplied source registry."

decision_meaning:
  ACCEPT_FOR_DEEP_REVIEW: "Repository licence is compatible with commercial modification/integration on the evidence checked; still requires security, dependency and architectural review before adoption."
  FORK_OR_SERVICE_BOUNDARY: "Useful open code, but copyleft obligations make a deliberate fork/service boundary and legal review necessary before proprietary integration."
  REFERENCE_ONLY: "Useful as a catalogue, pattern or research source rather than a runtime dependency."
  RESTRICTED_LICENSE: "Source is available, but current repository licence has material field-of-use/competing-use/internal-use restrictions or is not OSI-open; do not present as unrestricted open source."
  LICENCE_UNVERIFIED: "A repository licence could not be verified from the standard licence-file locations checked; do not adopt until resolved."
  DISCOVERY_ONLY: "GitHub organisation/topic link is a discovery surface, not a single adoptable code artefact."

