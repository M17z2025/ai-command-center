  promotion_rule: "External code may move beyond REVIEW only after licence, commercial-use, maintenance, security/supply-chain and integration-fit evidence is recorded."
  generator_factory_rule: "Useful patterns may inspire Sigma-owned declarative generators, but source links do not grant runtime authority."

