schema_version: 1
project:
  name: "Sigma Development Command Center"
  repository: "M17z2025/ai-command-center"
  product_owner: "M17z2025"
  lifecycle: "active"
  priority: "high"

product:
  purpose: "Portfolio-level engineering control plane plus governed operational expert-mesh runtime for the Mi7z/Lycia portfolio."
  users:
    - "Product owner"
    - "Sigma agents"
    - "ChatGPT and implementation agents"
    - "Developers and reviewers"
  critical_flows:
    - "Resolve managed products from projects/registry.yaml"
    - "Read product contracts and status before development"
    - "Create repository-backed implementation handoffs and work orders"
    - "Enforce security, verification and definition-of-done gates"
    - "Require independent Sigma User Tester evidence for applicable user-facing releases"
    - "Run routed Sigma expert missions through critic, evidence-verification, repair and synthesis stages"
    - "Persist private mission/audit/learning state outside the public Git repository"
    - "Preserve auditable portfolio state in GitHub"

stack:
  frontend: "None - control-plane repository and API runtime"
  backend: "Python 3.12 control plane plus operational expert-mesh runtime"
  database: "SQLite for private runtime mission/audit/learning state"
  auth: "GitHub repository permissions for control plane; bearer token for network-exposed runtime API"
  storage: "Git repository for governance; private runtime volume for SQLite state"
  hosting: "GitHub for control plane; runtime is container-ready for an approved private host"
  package_manager: "pip"

commands:
  install: "pip install -r requirements-control.txt"
  dev: "python scripts/sigma_mesh_runtime.py serve"
  build: "docker build -f Dockerfile.sigma-runtime -t sigma-mesh-runtime ."
  lint: ""
  typecheck: ""
  test: "python -m unittest discover -s tests -p 'test_*.py' && python scripts/validate_control_plane.py"
  test_integration: "SIGMA_RUNTIME_PROVIDER=test SIGMA_ALLOW_TEST_PROVIDER=1 python scripts/sigma_mesh_runtime.py --db /tmp/sigma-runtime.db smoke"

deployment:
  provider: "Private container host selected by owner"
  production_url: ""
  production_branch: "main"
  instructions: "docs/deployment.md"

security:
  multi_tenant: false
  rls_required: false
  financial_data: false
  health_data: false
  legal_data: false
  pii: false

documentation:
  architecture: "docs/architecture.md"
  deployment: "docs/deployment.md"
  status: "PROJECT_STATUS.md"
  user_tester: "docs/SIGMA_USER_TESTER.md"
  mesh_runtime: "docs/SIGMA_MESH_RUNTIME.md"

integrations:
  - "GitHub"
  - "GitHub Actions"
  - "Configurable HTTP model inference endpoint"

environment_variables:
  - SIGMA_RUNTIME_PROVIDER
  - SIGMA_LLM_ENDPOINT
  - SIGMA_LLM_MODEL
  - SIGMA_LLM_PROTOCOL
  - SIGMA_LLM_API_KEY
  - SIGMA_LLM_TIMEOUT_SECONDS
  - SIGMA_RUNTIME_DB
  - SIGMA_RUNTIME_HOST
  - SIGMA_RUNTIME_PORT
  - SIGMA_RUNTIME_TOKEN
  - SIGMA_RUNTIME_HTTP_LOG
  - SIGMA_ALLOW_TEST_PROVIDER

constraints:
  - "Product source code remains in product repositories; Sigma stores control-plane state and rules."
  - "No secrets, credentials, customer data or production tokens in this repository, issues, logs or screenshots."
  - "Repository evidence overrides chat memory for project state."
  - "Material changes use branches and pull requests."
  - "Destructive production actions and security-control reductions require explicit owner approval."
  - "The expert runtime is advisory by default and has no implicit repository, production, finance or secret-management authority."
  - "Private mission prompts, outputs and SQLite runtime state must never be committed to this public repository."
  - "A real mission fails closed unless a live model endpoint/model are configured; the deterministic provider is CI/smoke-only."

definition_of_done_additions:
  - "Sigma control-plane validation passes on the exact change head."
  - "Operational mesh unit tests and deterministic end-to-end smoke pass on the exact change head."
  - "The command-center self-manifest and required governance artefacts remain schema-valid/present."
  - "Applicable user-facing product releases retain independent Sigma User Tester evidence; this runtime has no end-user UI to certify."
